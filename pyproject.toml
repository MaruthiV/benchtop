[project]
name = "benchtop"
version = "0.1.0"
description = "turn arXiv papers into cheap, verifiable RL environments for experimental research taste"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "torch>=2.6",
  "mcp>=2.3",
  "starlette>=0.40",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "matplotlib>=3.9",
]

[project.scripts]
benchtop = "benchtop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchtop"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM115", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
